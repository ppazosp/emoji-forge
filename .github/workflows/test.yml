name: Script tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      FORGE_TEST_CHROME: chrome
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install headless OpenGL libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Install the package and test tools
        run: python -m pip install './skills/emoji-forge[gpu,webgl,test]'
      - name: Test the command-line entry point
        run: forge --help
      - name: Run tests
        run: python -m pytest -q

  skill-install:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Check skill metadata and links
        run: |
          uvx --from 'git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref' skills-ref validate skills/emoji-forge
          uv run --no-project --with markdown-it-py python tools/check_skill_links.py skills/emoji-forge
          cmp LICENSE skills/emoji-forge/LICENSE
      - name: Install this checkout into an empty project
        run: |
          mkdir "$RUNNER_TEMP/emoji-forge-install"
          git init -q "$RUNNER_TEMP/emoji-forge-install"
          cd "$RUNNER_TEMP/emoji-forge-install"
          npx --yes skills@1.9.0 add "$GITHUB_WORKSPACE" -a claude-code -a codex -a cursor -y
          test -f .claude/skills/emoji-forge/SKILL.md
          cd .agents/skills/emoji-forge
          test -f references/workflow.md
          test -f scripts/forge.py
          test -f shaders/library.glsl
          test -f assets/lantern/pack.json
          uv run --locked forge all assets/lantern/draw.py "$RUNNER_TEMP/lantern-smoke" --draft --no-register
          test -f "$RUNNER_TEMP/lantern-smoke/pack/draw.gif"

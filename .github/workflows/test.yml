name: Script tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      FORGE_TEST_CHROME: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the package and test tools
        run: python -m pip install '.[gpu,webgl,test]'
      - name: Test the command-line entry point
        run: forge --help
      - name: Run tests
        run: python -m pytest -q
